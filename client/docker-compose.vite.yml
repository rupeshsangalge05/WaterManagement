version: '3.8'

services:
  frontend-vite:
    build:
      context: .
      dockerfile: Dockerfile.vite.full
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:5000
    container_name: mern-frontend-vite

