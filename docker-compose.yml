# version: '3.8'

services:
  # Connect to backend
  backend:
    build: ./server
    container_name: backend
    restart: always
    env_file:
     - ./server/.env
    ports:
      - "5000:5000"
  #   environment:
  #     - MONGODB_URI=mongodb://mongo:27017/mern
  #   depends_on:
  #     - mongo
  
  
  # Connect to frontend
  frontend:
    build: ./client
    container_name: frontend
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - backend

